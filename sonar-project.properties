# SonarQube Cloud — fork-only analysis for MTG-Thomas/bifrost-upstream.
# One-time manual onboarding: in SonarCloud choose "Import from GitHub" for
# MTG-Thomas/bifrost-upstream with the "With GitHub Actions" method, then
# replace sonar.organization / sonar.projectKey below with the tutorial's
# exact values and add a SONAR_TOKEN secret to the fork.
# shortcut: no coverage wired yet — Sonar reports 0% coverage until
# pytest/vitest LCOV outputs are passed via sonar.python.coverage / lcov paths.
sonar.organization=mtg-thomas
sonar.projectKey=MTG-Thomas_bifrost-upstream
sonar.projectName=bifrost-upstream

sonar.sources=api,client/src
sonar.tests=api/tests
sonar.test.inclusions=api/tests/**,client/**/*.test.*,desktop/**/*.test.*
sonar.exclusions=**/node_modules/**,**/package-lock.json,**/requirements*.lock,client/src/lib/v1.d.ts,api/tests/**

sonar.python.version=3.12
sonar.sourceEncoding=UTF-8
