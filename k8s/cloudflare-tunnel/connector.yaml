apiVersion: v1
kind: Secret
metadata:
  name: bifrost-cloudflare-connector
  namespace: bifrost
  labels:
    app.kubernetes.io/component: cloudflare-connector
    app.kubernetes.io/part-of: bifrost
type: Opaque
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bifrost-cloudflare-connector
  namespace: bifrost
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["bifrost-cloudflare-connector"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bifrost-cloudflare-connector
  namespace: bifrost
subjects:
  - kind: ServiceAccount
    name: bifrost-api
    namespace: bifrost
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bifrost-cloudflare-connector
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bifrost-cloudflare-connector
  namespace: bifrost
  labels:
    app.kubernetes.io/name: bifrost-cloudflare-connector
    app.kubernetes.io/component: cloudflare-connector
    app.kubernetes.io/part-of: bifrost
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bifrost-cloudflare-connector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bifrost-cloudflare-connector
        app.kubernetes.io/component: cloudflare-connector
        app.kubernetes.io/part-of: bifrost
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: connector
          image: ghcr.io/gobifrost/bifrost-api:latest
          command: ["python", "/app/scripts/cloudflare_connector.py"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              memory: "128Mi"
          volumeMounts:
            - name: connector-token
              mountPath: /run/bifrost-tunnel
              readOnly: true
      volumes:
        - name: connector-token
          secret:
            secretName: bifrost-cloudflare-connector
            defaultMode: 0440
            optional: true
            items:
              - key: token
                path: token
