apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bifrost-cloudflare-connector
  namespace: bifrost
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bifrost-cloudflare-connector
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bifrost-api
      ports:
        - {protocol: TCP, port: 8001}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    # Global region1 and region2 endpoints from Cloudflare's Tunnel firewall documentation.
    - to:
        - ipBlock: {cidr: "198.41.192.167/32"}
        - ipBlock: {cidr: "198.41.192.67/32"}
        - ipBlock: {cidr: "198.41.192.57/32"}
        - ipBlock: {cidr: "198.41.192.107/32"}
        - ipBlock: {cidr: "198.41.192.27/32"}
        - ipBlock: {cidr: "198.41.192.7/32"}
        - ipBlock: {cidr: "198.41.192.227/32"}
        - ipBlock: {cidr: "198.41.192.47/32"}
        - ipBlock: {cidr: "198.41.192.37/32"}
        - ipBlock: {cidr: "198.41.192.77/32"}
        - ipBlock: {cidr: "198.41.200.13/32"}
        - ipBlock: {cidr: "198.41.200.193/32"}
        - ipBlock: {cidr: "198.41.200.33/32"}
        - ipBlock: {cidr: "198.41.200.233/32"}
        - ipBlock: {cidr: "198.41.200.53/32"}
        - ipBlock: {cidr: "198.41.200.63/32"}
        - ipBlock: {cidr: "198.41.200.113/32"}
        - ipBlock: {cidr: "198.41.200.73/32"}
        - ipBlock: {cidr: "198.41.200.43/32"}
        - ipBlock: {cidr: "198.41.200.23/32"}
        - ipBlock: {cidr: "2606:4700:a0::1/128"}
        - ipBlock: {cidr: "2606:4700:a0::2/128"}
        - ipBlock: {cidr: "2606:4700:a0::3/128"}
        - ipBlock: {cidr: "2606:4700:a0::4/128"}
        - ipBlock: {cidr: "2606:4700:a0::5/128"}
        - ipBlock: {cidr: "2606:4700:a0::6/128"}
