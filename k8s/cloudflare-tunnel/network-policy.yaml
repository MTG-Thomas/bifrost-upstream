        - ipBlock: {cidr: "2606:4700:a8::3/128"}
        - ipBlock: {cidr: "2606:4700:a8::4/128"}
        - ipBlock: {cidr: "2606:4700:a8::5/128"}
        - ipBlock: {cidr: "2606:4700:a8::6/128"}
        - ipBlock: {cidr: "2606:4700:a8::7/128"}
