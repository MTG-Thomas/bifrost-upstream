# SonarQube Cloud Automatic Analysis config (MTG-Thomas/bifrost-upstream, fork-only).
# This is a different file from sonar-project.properties (CI scanner config,
# which Automatic Analysis ignores). Only the keys listed in the Automatic
# Analysis docs are honored here; wildcard patterns are NOT allowed in this
# file — broader exclusions (node_modules, generated v1.d.ts) belong in the
# SonarCloud UI under Administration > General Settings > Analysis Scope.
sonar.sources=api,client/src
sonar.tests=api/tests
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8
